name: Verify Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Secret Exists Safely
        run: |
          if [ -n "${{ secrets.DINEDESK_DEMO_KEY }}" ]; then
            echo "DINEDESK_DEMO_KEY is configured successfully."
          else
            echo "DINEDESK_DEMO_KEY is missing!"
            exit 1
          fi
